name: agent-skills-radar

on:
  schedule:
    # UTC 00:50 = 北京时间 08:50；GitHub Actions 定时可能有数分钟延迟
    - cron: "50 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run skills radar
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python skills_radar.py

      - name: Commit daily report
        run: |
          git config user.name "skills-radar-bot"
          git config user.email "skills-bot@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "无新增内容，跳过提交"
          else
            git commit -m "chore: agent skills radar $(date -u +%F)"
            git push
          fi
